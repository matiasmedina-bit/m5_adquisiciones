{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contraseña actualizada · M5 SpA</title>
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="{% static 'img/favicon-32.png' %}?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'img/favicon-180.png' %}?v=2">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}?v=3" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card card">
    <div class="login-header">
      <img src="{% static 'img/Logo-M5.png' %}?v=2" alt="M5 SpA">
      <p class="mb-0 small opacity-75 mt-2">Sistema de Gestión de Adquisiciones</p>
    </div>
    <div class="login-body">
      <div class="text-center">
        <i class="bi bi-check-circle fs-1 text-success"></i>
        <h1 class="h5 mt-2 mb-2">Contraseña lista</h1>
        <p class="small text-muted">
          Ya puedes entrar al sistema con tu contraseña nueva.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
          Iniciar sesión
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>

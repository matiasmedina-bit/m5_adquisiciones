{% extends 'base.html' %}
{% block title %}Contraseña cambiada{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle text-success" style="font-size:2.5rem;"></i>
        <h1 class="h4 mt-2 mb-1">Listo</h1>
        <p class="text-muted small mb-4">
          Tu contraseña quedó cambiada. La próxima vez que entres, usa la nueva.
        </p>
        <a href="{% url 'usuarios:mi_perfil' %}" class="btn btn-primary">Volver a mi perfil</a>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · M5 SpA</title>
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="{% static 'img/favicon-32.png' %}?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'img/favicon-180.png' %}?v=2">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}?v=3" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card card">
    <div class="login-header">
      <img src="{% static 'img/Logo-M5.png' %}?v=2" alt="M5 SpA">
      <p class="mb-0 small opacity-75 mt-2">Sistema de Gestión de Adquisiciones</p>
    </div>
    <div class="login-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% if form.errors %}
        <div class="alert alert-danger py-2 small d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos.
        </div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-medium small">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="nombre.apellido" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-medium small">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="password" id="pw" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
            <button type="button" class="input-group-text bg-light border-start-0" onclick="togglePw()">
              <i class="bi bi-eye" id="pw-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
        </button>
      </form>
      <hr class="my-3">
      <p class="text-center small text-muted mb-0">
        ¿No tienes cuenta?
        <a href="{% url 'registro' %}" class="text-decoration-none fw-medium">Solicitar acceso</a>
      </p>
    </div>
  </div>
</div>
<script>
function togglePw(){
  const pw=document.getElementById('pw');
  const ic=document.getElementById('pw-icon');
  if(pw.type==='password'){pw.type='text';ic.className='bi bi-eye-slash';}
  else{pw.type='password';ic.className='bi bi-eye';}
}
</script>
</body>
</html>

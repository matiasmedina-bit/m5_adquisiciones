{% extends 'base.html' %}
{% block content %}
<h1 class="h3 mb-3">Partida de itemizado · {{ proyecto.nombre }}</h1>
<div class="card shadow-sm"><div class="card-body">
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'proyectos:detalle' proyecto.pk %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
</div></div>
{% endblock %}

# ============================================================
#  RNF-07 — nginx con HTTPS obligatorio para el sistema M5
#
#  Copiar a /etc/nginx/sites-available/m5, enlazar en sites-enabled
#  y recargar:  sudo nginx -t && sudo systemctl reload nginx
#
#  Certificado: el que entregue TI de M5 para el nombre del servidor
#  (o uno de Let's Encrypt si el servidor se publica en internet).
#  Reemplazar las dos rutas ssl_certificate*.
#
#  En el .env de la aplicacion:  USAR_HTTPS=True
#  (activa redireccion, cookies "Secure" y HSTS en Django).
# ============================================================

# Todo lo que llegue por http se manda a https
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/m5/m5.crt;
    ssl_certificate_key /etc/ssl/m5/m5.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2100m;   # planos y videos de proyecto (RNF-05)

    location /static/ {
        alias /opt/m5/app/staticfiles/;
    }

    # Los archivos subidos NO se publican: los entrega Django despues de
    # revisar permisos (descarga protegida). nginx solo los lee cuando
    # Django se lo indica con X-Accel-Redirect.
    location /protegido/ {
        internal;
        alias /opt/m5/app/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
